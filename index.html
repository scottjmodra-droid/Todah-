<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToDo</title>
  <style>
    :root {
      --bg:         #FAF6F0;
      --surface:    #F2E9DE;
      --surface-2:  #E8DDD0;
      --border:     #DDD0BF;
      --primary:    #B8622A;
      --primary-lt: #E8C4A0;
      --text:       #3C2A1E;
      --text-muted: #9C7E6A;
      --completed:  #C4B0A0;
      --soon-bg:    #FAEBDF;
      --soon-fg:    #B8622A;
      --later-bg:   #EDE8DE;
      --later-fg:   #7A7258;
      --day-bg:     #E8EEF8;
      --day-fg:     #3A5080;
      --radius:     10px;
      --shadow:     0 2px 10px rgba(60,42,30,0.09);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px 0;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      display: inline-flex;
      align-items: baseline;
      gap: 0;
      margin-bottom: 14px;
      user-select: none;
    }

    .logo-to {
      background: #1A1A1A;
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.5px;
      padding: 3px 7px 3px 8px;
      border-radius: 6px 0 0 6px;
    }

    .logo-do {
      background: #FFFFFF;
      color: #1A1A1A;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.5px;
      padding: 3px 8px 3px 7px;
      border-radius: 0 6px 6px 0;
      border: 2px solid #1A1A1A;
      border-left: none;
    }

    .logo-ver {
      font-size: 10px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 8px;
      opacity: 0.6;
    }

    /* ── Tabs ────────────────────────────────────────────────────────────────── */
    .tabs { display: flex; gap: 2px; }

    .tab {
      padding: 8px 16px 9px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
      border-bottom: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 7px 7px 0 0;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .tab:hover { color: var(--text); }

    .tab.active {
      background: var(--bg);
      color: var(--primary);
      border-color: var(--border);
      border-bottom-color: var(--bg);
    }

    /* ── Content ─────────────────────────────────────────────────────────────── */
    .content {
      max-width: 580px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    .section { display: none; }
    .section.active { display: block; }

    /* ── Add Form ────────────────────────────────────────────────────────────── */
    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .add-form input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 14px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .add-form input[type="text"]::placeholder { color: var(--text-muted); }
    .add-form input[type="text"]:focus { border-color: var(--primary); }

    .tag-select {
      padding: 10px 8px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      outline: none;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-add {
      padding: 10px 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 22px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-add:hover { opacity: 0.88; }
    .btn-add:active { transform: scale(0.95); }

    /* ── Group labels ────────────────────────────────────────────────────────── */
    .group-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      padding: 0 2px;
      margin: 22px 0 8px;
    }

    .group-label:first-child { margin-top: 0; }

    /* ── Items ───────────────────────────────────────────────────────────────── */
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 12px;
      box-shadow: var(--shadow);
      transition: opacity 0.15s, box-shadow 0.15s;
      user-select: none;
      position: relative;
    }

    .item.drag-source { opacity: 0; pointer-events: none; }

    /* ── Drag handle ─────────────────────────────────────────────────────────── */
    .drag-handle {
      font-size: 16px;
      color: var(--text-muted);
      opacity: 0.4;
      cursor: grab;
      flex-shrink: 0;
      line-height: 1;
      padding: 4px 4px;
      touch-action: none;
      user-select: none;
    }

    .drag-handle:active { cursor: grabbing; opacity: 0.8; }

    /* ── Checkbox ────────────────────────────────────────────────────────────── */
    .item-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--primary-lt);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .item-check.checked {
      background: var(--primary);
      border-color: var(--primary);
    }

    .item-check.checked::after {
      content: '';
      display: block;
      width: 9px;
      height: 5px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translateY(-1px);
    }

    /* ── Item text ───────────────────────────────────────────────────────────── */
    .item-text {
      flex: 1;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      cursor: text;
    }

    .item-text:hover { text-decoration: underline dotted var(--text-muted); }

    .item.completed .item-text {
      text-decoration: line-through;
      color: var(--completed);
    }

    /* ── Tag badges (Soon / Later / Day) ─────────────────────────────────────── */
    .item-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 20px;
      flex-shrink: 0;
      cursor: pointer;
      border: none;
      outline: none;
      transition: opacity 0.15s;
    }

    .item-tag:active { opacity: 0.7; }

    .tag-soon  { background: var(--soon-bg);  color: var(--soon-fg); }
    .tag-later { background: var(--later-bg); color: var(--later-fg); }
    .tag-none  { background: var(--surface-2); color: var(--text-muted); }
    .tag-day   { background: var(--day-bg);   color: var(--day-fg); }

    /* ── Move button ─────────────────────────────────────────────────────────── */
    .btn-move {
      background: transparent;
      border: 1px solid var(--primary-lt);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 13px;
      line-height: 1;
      color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn-move:hover, .btn-move:active {
      background: var(--soon-bg);
      border-color: var(--primary);
    }

    /* ── Delete button ───────────────────────────────────────────────────────── */
    .item-actions { display: flex; flex-shrink: 0; }

    .btn-action {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }

    .btn-action.btn-delete:hover,
    .btn-action.btn-delete:active {
      background: #FAEAE4;
      color: #B84030;
      border-color: #E0B0A8;
    }

    /* ── Inline edit ─────────────────────────────────────────────────────────── */
    .item-edit-input {
      flex: 1;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1.5px solid var(--primary);
      border-radius: 6px;
      padding: 2px 7px;
      outline: none;
      min-width: 0;
    }

    /* ── Context menu (long-press popup) ─────────────────────────────────────── */
    .ctx-menu {
      position: fixed;
      z-index: 2000;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(60,42,30,0.18);
      overflow: hidden;
      min-width: 140px;
    }

    .ctx-item {
      display: block;
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      color: var(--text);
      transition: background 0.1s;
    }

    .ctx-item:last-child { border-bottom: none; }
    .ctx-item:hover, .ctx-item:active { background: var(--surface); }
    .ctx-item.active { color: var(--primary); font-weight: 700; }

    .ctx-overlay {
      position: fixed;
      inset: 0;
      z-index: 1999;
    }

    /* ── Notes ───────────────────────────────────────────────────────────────── */
    .note-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 12px;
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    .note-preview { flex: 1; min-width: 0; }

    .note-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      word-break: break-word;
      color: var(--text);
    }

    .note-body {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-top: 3px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .note-more {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Note modal ──────────────────────────────────────────────────────────── */
    .note-overlay {
      position: fixed;
      inset: 0;
      background: rgba(60,42,30,0.4);
      z-index: 1500;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .note-modal {
      background: var(--bg);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -4px 24px rgba(60,42,30,0.15);
    }

    .note-modal-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }

    .note-modal-header span {
      flex: 1;
      font-size: 12px;
      color: var(--text-muted);
    }

    .note-close {
      background: var(--surface-2);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .note-textarea {
      flex: 1;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
      padding: 16px;
      resize: none;
      line-height: 1.6;
      min-height: 200px;
    }

    /* ── Backup bar ──────────────────────────────────────────────────────────── */
    .backup-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 10px 16px;
      z-index: 10;
    }

    .btn-backup {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }

    .btn-backup:hover, .btn-backup:active {
      background: var(--surface-2);
      border-color: var(--text-muted);
      color: var(--text);
    }

    /* ── Empty state ─────────────────────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 48px 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span class="logo-to">To</span><span class="logo-do">Do</span>
      <span class="logo-ver">v2.0</span>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="week">▦ Week</button>
      <button class="tab" data-tab="all">∷ All</button>
      <button class="tab" data-tab="notes">✎ Notes</button>
    </nav>
  </header>

  <div class="content">

    <!-- ── WEEK ──────────────────────────────────────────────────────────────── -->
    <section class="section active" id="week-section">
      <div class="add-form">
        <input type="text" id="week-input" placeholder="Add to this week…" autocomplete="off" />
        <select class="tag-select" id="week-day-select" title="Day">
          <option value="">Any day</option>
          <option value="mon">Mon</option>
          <option value="tue">Tue</option>
          <option value="wed">Wed</option>
          <option value="thu">Thu</option>
          <option value="fri">Fri</option>
          <option value="sat">Sat</option>
          <option value="sun">Sun</option>
        </select>
        <button class="btn-add" id="week-add-btn" title="Add">+</button>
      </div>
      <div id="week-container"></div>
    </section>

    <!-- ── ALL ───────────────────────────────────────────────────────────────── -->
    <section class="section" id="all-section">
      <div class="add-form">
        <input type="text" id="all-input" placeholder="Add a task…" autocomplete="off" />
        <select class="tag-select" id="all-tag-select" title="Tag">
          <option value="">No tag</option>
          <option value="soon">Soon</option>
          <option value="later">Later</option>
        </select>
        <button class="btn-add" id="all-add-btn" title="Add">+</button>
      </div>
      <div id="all-container"></div>
    </section>

    <!-- ── NOTES ─────────────────────────────────────────────────────────────── -->
    <section class="section" id="notes-section">
      <div class="add-form">
        <input type="text" id="notes-input" placeholder="New note title…" autocomplete="off" />
        <button class="btn-add" id="notes-add-btn" title="Add">+</button>
      </div>
      <div class="items-list" id="notes-list"></div>
    </section>

  </div>

  <div class="backup-bar">
    <button class="btn-backup" id="export-btn">↓ Export backup</button>
    <button class="btn-backup" id="import-btn">↑ Import backup</button>
    <input type="file" id="import-file" accept=".json" style="display:none" />
  </div>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // Constants
    // ─────────────────────────────────────────────────────────────────────────
    const STORAGE_KEY = 'mytodo_v1';
    const DAY_ORDER   = ['mon','tue','wed','thu','fri','sat','sun'];
    const DAY_LABEL   = { mon:'MON', tue:'TUE', wed:'WED', thu:'THU', fri:'FRI', sat:'SAT', sun:'SUN' };

    // ─────────────────────────────────────────────────────────────────────────
    // State
    // ─────────────────────────────────────────────────────────────────────────
    function loadState() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch { return {}; }
    }

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function uid()  { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

    function todayMidnight() {
      const d = new Date(); d.setHours(0,0,0,0); return d.getTime();
    }

    const raw = loadState();

    // Migrate: old 'today' items become 'week' items with no day tag
    const state = {
      week:  raw.week  || (raw.today ? raw.today.map(i => ({ ...i, day: '' })) : []),
      all:   raw.all   || [],
      notes: raw.notes || [],
    };

    // Clean up expired completed week items
    state.week = state.week.filter(
      item => !(item.completed && item.completedAt < todayMidnight())
    );
    save();

    // ─────────────────────────────────────────────────────────────────────────
    // Tab switching
    // ─────────────────────────────────────────────────────────────────────────
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + '-section').classList.add('active');
      });
    });

    // ─────────────────────────────────────────────────────────────────────────
    // Context menu (for long-press tag/day selection)
    // ─────────────────────────────────────────────────────────────────────────
    function showMenu(anchorEl, options, onSelect) {
      document.querySelector('.ctx-overlay')?.remove();
      document.querySelector('.ctx-menu')?.remove();

      const overlay = document.createElement('div');
      overlay.className = 'ctx-overlay';

      const menu = document.createElement('div');
      menu.className = 'ctx-menu';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'ctx-item' + (opt.active ? ' active' : '');
        btn.textContent = opt.label;
        btn.addEventListener('click', e => {
          e.stopPropagation();
          overlay.remove();
          menu.remove();
          onSelect(opt.value);
        });
        menu.appendChild(btn);
      });

      document.body.appendChild(overlay);
      document.body.appendChild(menu);

      // Position near anchor
      const r = anchorEl.getBoundingClientRect();
      const mw = 160;
      let left = r.left;
      if (left + mw > window.innerWidth - 8) left = window.innerWidth - mw - 8;
      menu.style.left = left + 'px';
      const menuH = options.length * 45;
      const below = r.bottom + 4 + menuH < window.innerHeight;
      menu.style.top = (below ? r.bottom + 4 : r.top - menuH - 4) + 'px';

      overlay.addEventListener('click', () => { overlay.remove(); menu.remove(); });
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Long-press utility
    // ─────────────────────────────────────────────────────────────────────────
    function attachLongPress(el, callback) {
      let timer = null;
      let moved = false;

      function start(e) {
        moved = false;
        timer = setTimeout(() => { if (!moved) callback(e); }, 500);
      }

      function cancel() { clearTimeout(timer); timer = null; }

      el.addEventListener('mousedown',   start);
      el.addEventListener('touchstart',  start, { passive: true });
      el.addEventListener('mousemove',   () => { moved = true; cancel(); });
      el.addEventListener('touchmove',   () => { moved = true; cancel(); }, { passive: true });
      el.addEventListener('mouseup',     cancel);
      el.addEventListener('mouseleave',  cancel);
      el.addEventListener('touchend',    cancel);
      el.addEventListener('touchcancel', cancel);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // WEEK section
    // ─────────────────────────────────────────────────────────────────────────
    const weekInput    = document.getElementById('week-input');
    const weekAddBtn   = document.getElementById('week-add-btn');
    const weekDaySel   = document.getElementById('week-day-select');
    const weekContainer= document.getElementById('week-container');

    weekAddBtn.addEventListener('click', addWeek);
    weekInput.addEventListener('keydown', e => { if (e.key === 'Enter') addWeek(); });

    function addWeek() {
      const text = weekInput.value.trim();
      if (!text) return;
      // New items prepended (unshift) so they appear at top of uncategorised
      state.week.unshift({ id: uid(), text, completed: false, completedAt: null, day: weekDaySel.value });
      save();
      weekInput.value = '';
      weekDaySel.value = '';
      renderWeek();
    }

    function renderWeek() {
      weekContainer.innerHTML = '';

      if (!state.week.length) {
        weekContainer.innerHTML = '<div class="empty-state">Nothing for this week yet.<br>Add something above ▦</div>';
        return;
      }

      function renderGroup(items, label, isDayGroup) {
        if (!items.length) return;
        const gl = document.createElement('div');
        gl.className = 'group-label';
        gl.textContent = label;
        weekContainer.appendChild(gl);

        const list = document.createElement('div');
        list.className = 'items-list';
        weekContainer.appendChild(list);

        // Within each group: uncompleted first, completed last
        const display = [
          ...items.filter(i => !i.completed),
          ...items.filter(i =>  i.completed),
        ];
        display.forEach(item => list.appendChild(makeWeekItem(item)));
        attachDrag(list, state.week, renderWeek);
      }

      // Uncategorised (no day) — newest first (already inserted with unshift)
      const uncategorised = state.week.filter(i => !i.day);
      renderGroup(uncategorised, 'Any day');

      // Then Mon → Sun
      DAY_ORDER.forEach(day => {
        const items = state.week.filter(i => i.day === day);
        renderGroup(items, DAY_LABEL[day]);
      });
    }

    function makeWeekItem(item) {
      const dayLabel = item.day ? DAY_LABEL[item.day] : '+ day';
      const tagClass = item.day ? 'tag-day' : 'tag-none';

      const el = document.createElement('div');
      el.className = 'item' + (item.completed ? ' completed' : '');
      el.dataset.id = item.id;
      el.innerHTML = `
        <span class="drag-handle" aria-hidden="true">⠿</span>
        <div class="item-check${item.completed ? ' checked' : ''}" role="checkbox" aria-checked="${item.completed}" tabindex="0"></div>
        <span class="item-text">${esc(item.text)}</span>
        <button class="item-tag ${tagClass}" data-action="day" title="Hold to change day">${dayLabel}</button>
        <button class="btn-move" data-action="move" title="Move to All">∷</button>
        <div class="item-actions">
          <button class="btn-action btn-delete" data-action="delete">✕</button>
        </div>
      `;

      const check = el.querySelector('.item-check');
      const toggle = () => {
        item.completed = !item.completed;
        item.completedAt = item.completed ? Date.now() : null;
        save(); renderWeek();
      };
      check.addEventListener('click', toggle);
      check.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } });

      // Long press tag to pick day
      const dayBtn = el.querySelector('[data-action="day"]');
      attachLongPress(dayBtn, () => {
        const opts = [
          { label: '— Any day', value: '', active: !item.day },
          ...DAY_ORDER.map(d => ({ label: DAY_LABEL[d], value: d, active: item.day === d })),
        ];
        showMenu(dayBtn, opts, val => { item.day = val; save(); renderWeek(); });
      });
      // Short tap also opens menu (more discoverable on mobile)
      dayBtn.addEventListener('click', e => {
        e.stopPropagation();
        const opts = [
          { label: '— Any day', value: '', active: !item.day },
          ...DAY_ORDER.map(d => ({ label: DAY_LABEL[d], value: d, active: item.day === d })),
        ];
        showMenu(dayBtn, opts, val => { item.day = val; save(); renderWeek(); });
      });

      el.querySelector('[data-action="move"]').addEventListener('click', () => {
        state.week.splice(state.week.indexOf(item), 1);
        state.all.push({ id: item.id, text: item.text, tag: '' });
        save(); renderWeek(); renderAll();
      });

      el.querySelector('[data-action="delete"]').addEventListener('click', () => {
        state.week.splice(state.week.indexOf(item), 1);
        save(); renderWeek();
      });

      makeEditable(el.querySelector('.item-text'), item, renderWeek);
      return el;
    }

    // ─────────────────────────────────────────────────────────────────────────
    // ALL section
    // ─────────────────────────────────────────────────────────────────────────
    const allInput     = document.getElementById('all-input');
    const allAddBtn    = document.getElementById('all-add-btn');
    const allTagSelect = document.getElementById('all-tag-select');
    const allContainer = document.getElementById('all-container');

    allAddBtn.addEventListener('click', addAll);
    allInput.addEventListener('keydown', e => { if (e.key === 'Enter') addAll(); });

    function addAll() {
      const text = allInput.value.trim();
      if (!text) return;
      state.all.push({ id: uid(), text, tag: allTagSelect.value });
      save();
      allInput.value = '';
      allTagSelect.value = '';
      renderAll();
    }

    function renderAll() {
      allContainer.innerHTML = '';
      if (!state.all.length) {
        allContainer.innerHTML = '<div class="empty-state">No tasks yet.<br>Add something you want to get to ✨</div>';
        return;
      }

      const groups = [
        { key: 'soon',  label: 'Soon' },
        { key: 'later', label: 'Later' },
        { key: '',      label: 'Untagged' },
      ];

      groups.forEach(({ key, label }) => {
        const items = state.all.filter(i => i.tag === key);
        if (!items.length) return;

        const gl = document.createElement('div');
        gl.className = 'group-label';
        gl.textContent = label;
        allContainer.appendChild(gl);

        const list = document.createElement('div');
        list.className = 'items-list';
        allContainer.appendChild(list);

        items.forEach(item => list.appendChild(makeAllItem(item)));
        attachDrag(list, state.all, renderAll);
      });
    }

    function makeAllItem(item) {
      const tagLabel = item.tag === 'soon' ? 'Soon' : item.tag === 'later' ? 'Later' : '+ tag';
      const tagClass = item.tag ? `tag-${item.tag}` : 'tag-none';

      const el = document.createElement('div');
      el.className = 'item';
      el.dataset.id = item.id;
      el.innerHTML = `
        <span class="drag-handle" aria-hidden="true">⠿</span>
        <span class="item-text">${esc(item.text)}</span>
        <button class="item-tag ${tagClass}" data-action="tag" title="Hold to change tag">${tagLabel}</button>
        <button class="btn-move" data-action="week" title="Move to Week">▦</button>
        <div class="item-actions">
          <button class="btn-action btn-delete" data-action="delete">✕</button>
        </div>
      `;

      // Tag badge — tap or long press opens menu
      const tagBtn = el.querySelector('[data-action="tag"]');
      function openTagMenu() {
        const opts = [
          { label: '— No tag', value: '',      active: item.tag === '' },
          { label: 'Soon',     value: 'soon',  active: item.tag === 'soon' },
          { label: 'Later',    value: 'later', active: item.tag === 'later' },
        ];
        showMenu(tagBtn, opts, val => { item.tag = val; save(); renderAll(); });
      }
      tagBtn.addEventListener('click', e => { e.stopPropagation(); openTagMenu(); });

      el.querySelector('[data-action="week"]').addEventListener('click', () => {
        state.all.splice(state.all.indexOf(item), 1);
        state.week.unshift({ id: item.id, text: item.text, completed: false, completedAt: null, day: '' });
        save(); renderAll(); renderWeek();
      });

      el.querySelector('[data-action="delete"]').addEventListener('click', () => {
        state.all.splice(state.all.indexOf(item), 1);
        save(); renderAll();
      });

      makeEditable(el.querySelector('.item-text'), item, renderAll);
      return el;
    }

    // ─────────────────────────────────────────────────────────────────────────
    // NOTES section
    // ─────────────────────────────────────────────────────────────────────────
    const notesInput  = document.getElementById('notes-input');
    const notesAddBtn = document.getElementById('notes-add-btn');
    const notesList   = document.getElementById('notes-list');

    notesAddBtn.addEventListener('click', addNote);
    notesInput.addEventListener('keydown', e => { if (e.key === 'Enter') addNote(); });

    function addNote() {
      const text = notesInput.value.trim();
      if (!text) return;
      state.notes.unshift({ id: uid(), text });
      save();
      notesInput.value = '';
      renderNotes();
    }

    function renderNotes() {
      notesList.innerHTML = '';
      if (!state.notes.length) {
        notesList.innerHTML = '<div class="empty-state">No notes yet.<br>Tap + to start one ✎</div>';
        return;
      }
      state.notes.forEach(note => notesList.appendChild(makeNoteItem(note)));
    }

    function makeNoteItem(note) {
      const lines = (note.text || '').split('\n');
      const title = lines[0] || '(empty)';
      const bodyLines = lines.slice(1, 3);
      const hasMore = lines.length > 3;

      const el = document.createElement('div');
      el.className = 'note-item';
      el.dataset.id = note.id;
      el.innerHTML = `
        <div class="note-preview">
          <div class="note-title">${esc(title)}</div>
          ${bodyLines.length ? `<div class="note-body">${esc(bodyLines.join('\n'))}</div>` : ''}
          ${hasMore ? `<div class="note-more">…</div>` : ''}
        </div>
        <div class="item-actions">
          <button class="btn-action btn-delete" data-action="delete">✕</button>
        </div>
      `;

      // Click note body → open modal
      el.querySelector('.note-preview').addEventListener('click', () => openNoteModal(note));

      el.querySelector('[data-action="delete"]').addEventListener('click', e => {
        e.stopPropagation();
        if (note.text && !confirm('Delete this note?')) return;
        state.notes.splice(state.notes.indexOf(note), 1);
        save(); renderNotes();
      });

      return el;
    }

    function openNoteModal(note) {
      const overlay = document.createElement('div');
      overlay.className = 'note-overlay';
      overlay.innerHTML = `
        <div class="note-modal">
          <div class="note-modal-header">
            <span>Tap outside to save</span>
            <button class="note-close">✕</button>
          </div>
          <textarea class="note-textarea" placeholder="First line = title, then your note…"></textarea>
        </div>
      `;

      const textarea = overlay.querySelector('.note-textarea');
      textarea.value = note.text;
      document.body.appendChild(overlay);
      textarea.focus();
      // Move cursor to end
      textarea.setSelectionRange(textarea.value.length, textarea.value.length);

      function commitNote() {
        const val = textarea.value.trim();
        if (val !== note.text) {
          if (!val) {
            state.notes.splice(state.notes.indexOf(note), 1);
          } else {
            note.text = val;
          }
          save();
          renderNotes();
        }
        overlay.remove();
      }

      overlay.querySelector('.note-close').addEventListener('click', commitNote);
      overlay.addEventListener('click', e => { if (e.target === overlay) commitNote(); });
      // Prevent modal clicks closing it
      overlay.querySelector('.note-modal').addEventListener('click', e => e.stopPropagation());
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Drag-to-reorder
    // ─────────────────────────────────────────────────────────────────────────
    function attachDrag(listEl, masterArray, rerenderFn) {
      listEl.querySelectorAll('.drag-handle').forEach(handle => {
        handle.addEventListener('mousedown',  e => startDrag(e, e.clientX, e.clientY));
        handle.addEventListener('touchstart', e => {
          const t = e.touches[0];
          startDrag(e, t.clientX, t.clientY);
        }, { passive: false });
      });

      function startDrag(e, startX, startY) {
        e.preventDefault();
        const dragEl = e.currentTarget.closest('.item');
        if (!dragEl) return;

        const rect    = dragEl.getBoundingClientRect();
        const offsetY = startY - rect.top;
        const offsetX = startX - rect.left;

        const clone = dragEl.cloneNode(true);
        Object.assign(clone.style, {
          position: 'fixed', top: rect.top + 'px', left: rect.left + 'px',
          width: rect.width + 'px', margin: '0', zIndex: '1000', opacity: '0.9',
          pointerEvents: 'none', boxShadow: '0 10px 28px rgba(60,42,30,0.22)',
          transform: 'rotate(1.5deg) scale(1.02)',
        });
        document.body.appendChild(clone);

        const ph = document.createElement('div');
        ph.style.cssText = `height:${rect.height}px;border:2px dashed #E8C4A0;border-radius:10px;background:#FAEBDF;opacity:0.6;flex-shrink:0;`;
        dragEl.classList.add('drag-source');
        dragEl.after(ph);

        function move(cy, cx) {
          clone.style.top  = (cy - offsetY) + 'px';
          clone.style.left = (cx - offsetX) + 'px';
          const siblings = Array.from(listEl.querySelectorAll('.item:not(.drag-source)'));
          let placed = false;
          for (const sib of siblings) {
            const r = sib.getBoundingClientRect();
            if (cy < r.top + r.height / 2) { listEl.insertBefore(ph, sib); placed = true; break; }
          }
          if (!placed) listEl.appendChild(ph);
        }

        function finish() {
          ph.replaceWith(dragEl);
          dragEl.classList.remove('drag-source');
          clone.remove();

          const newIds    = Array.from(listEl.querySelectorAll('.item')).map(el => el.dataset.id);
          const idSet     = new Set(newIds);
          const reordered = newIds.map(id => masterArray.find(i => i.id === id)).filter(Boolean);
          let ri = 0;
          for (let i = 0; i < masterArray.length; i++) {
            if (idSet.has(masterArray[i].id)) masterArray[i] = reordered[ri++];
          }
          save(); rerenderFn();

          document.removeEventListener('mousemove',   onMouseMove);
          document.removeEventListener('mouseup',     finish);
          document.removeEventListener('touchmove',   onTouchMove);
          document.removeEventListener('touchend',    finish);
          document.removeEventListener('touchcancel', finish);
        }

        function onMouseMove(e) { move(e.clientY, e.clientX); }
        function onTouchMove(e) { e.preventDefault(); const t = e.touches[0]; move(t.clientY, t.clientX); }

        document.addEventListener('mousemove',   onMouseMove);
        document.addEventListener('mouseup',     finish);
        document.addEventListener('touchmove',   onTouchMove, { passive: false });
        document.addEventListener('touchend',    finish);
        document.addEventListener('touchcancel', finish);
      }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Inline text edit
    // ─────────────────────────────────────────────────────────────────────────
    function makeEditable(textSpan, item, rerenderFn) {
      textSpan.addEventListener('click', () => {
        if (textSpan.querySelector('.item-edit-input')) return;
        const current = item.text;
        const input = document.createElement('input');
        input.type = 'text'; input.className = 'item-edit-input'; input.value = current;
        textSpan.textContent = '';
        textSpan.appendChild(input);
        input.focus(); input.select();

        function commit() {
          const val = input.value.trim();
          if (val && val !== current) { item.text = val; save(); }
          rerenderFn();
        }
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter')  { e.preventDefault(); commit(); }
          if (e.key === 'Escape') { e.preventDefault(); rerenderFn(); }
        });
        input.addEventListener('blur', commit);
      });
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Backup
    // ─────────────────────────────────────────────────────────────────────────
    document.getElementById('export-btn').addEventListener('click', () => {
      const date = new Date().toISOString().slice(0,10);
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = `mytodo-backup-${date}.json`;
      a.click(); URL.revokeObjectURL(url);
    });

    const importFile = document.getElementById('import-file');
    document.getElementById('import-btn').addEventListener('click', () => { importFile.value = ''; importFile.click(); });
    importFile.addEventListener('change', () => {
      const file = importFile.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          if (!data.all) throw new Error();
          if (!confirm(`Replace all current data with backup from ${file.name}?`)) return;
          state.week  = data.week  || data.today || [];
          state.all   = data.all   || [];
          state.notes = data.notes || [];
          save(); renderWeek(); renderAll(); renderNotes();
        } catch { alert('Not a valid backup file.'); }
      };
      reader.readAsText(file);
    });

    // ─────────────────────────────────────────────────────────────────────────
    // Midnight cleanup
    // ─────────────────────────────────────────────────────────────────────────
    function scheduleMidnightCleanup() {
      const now  = new Date();
      const next = new Date(now);
      next.setDate(next.getDate() + 1); next.setHours(0,0,0,0);
      setTimeout(() => {
        state.week = state.week.filter(item => !(item.completed && item.completedAt < todayMidnight()));
        save(); renderWeek(); scheduleMidnightCleanup();
      }, next - now);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Utility
    // ─────────────────────────────────────────────────────────────────────────
    function esc(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Init
    // ─────────────────────────────────────────────────────────────────────────
    renderWeek();
    renderAll();
    renderNotes();
    scheduleMidnightCleanup();
  </script>

</body>
</html>
